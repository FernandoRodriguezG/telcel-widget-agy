name: Android Bait

on:
  push:
    paths:
      - "android-app/**"
      - "tests/fixtures/bait/**"
      - ".github/workflows/android-bait.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "tests/fixtures/bait/**"
      - ".github/workflows/android-bait.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Pruebas y APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versión desde el tag del release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#android-}"
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::El tag debe tener la forma android-v1.2.3 (recibido: $TAG)"
            exit 1
          fi
          echo "BAIT_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

      - name: Llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.BAIT_KEYSTORE_BASE64 }}
          IS_RELEASE: ${{ github.event_name == 'release' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BAIT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$IS_RELEASE" = "true" ]; then
            # Un release firmado con la llave debug no se podría actualizar encima de las versiones anteriores
            echo "::error::Los releases requieren los secrets BAIT_KEYSTORE_* (ver android-app/README.md)"
            exit 1
          else
            echo "::notice::Sin secret BAIT_KEYSTORE_BASE64: el APK se firma con la llave debug del runner"
          fi

      - name: Pruebas del parser y compilación
        env:
          BAIT_KEYSTORE_PASSWORD: ${{ secrets.BAIT_KEYSTORE_PASSWORD }}
          BAIT_KEY_ALIAS: ${{ secrets.BAIT_KEY_ALIAS }}
          BAIT_KEY_PASSWORD: ${{ secrets.BAIT_KEY_PASSWORD }}
        run: |
          ./gradlew :core:test :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MiBaitWidget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiBaitWidget-apk
          path: android-app/MiBaitWidget.apk

  emulator:
    name: Prueba de humo en emulador
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MiBaitWidget-apk
          path: android-app

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android-app
          script: ./scripts/emulator_smoke_test.sh MiBaitWidget.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: android-app/smoke

  publish:
    name: Adjuntar APK al release
    if: github.event_name == 'release'
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MiBaitWidget-apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" MiBaitWidget.apk --clobber --repo "${{ github.repository }}"
